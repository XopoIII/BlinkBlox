# This file lists tools managed by Rokit, a toolchain manager for Roblox projects.
# For more information, see https://github.com/rojo-rbx/rokit
#
# Every version here is pinned exactly. Run `rokit install` after cloning to get all of them.
# Versions are the latest releases as of 2026-10-06.
#
# Lune is this project's fork, LuneBlox: upstream Lune 0.10.5 runs Luau 0.709, and Roblox runs 0.740
# with its own set of Luau's flags. LuneBlox runs the Luau Roblox runs, with Roblox's flags.

[tools]
rojo = "rojo-rbx/rojo@7.7.1"                # file <-> Studio sync, and sourcemaps for luau-lsp
luneblox = "XopoIII/LuneBlox@0.10.13"       # Luau runtime: runs the compiler CLI, tests and benchmarks
stylua = "JohnnyMorganz/StyLua@2.5.2"       # formatter
selene = "Kampfkarren/selene@0.32.0"        # linter
luau-lsp = "JohnnyMorganz/luau-lsp@1.70.1"  # editor LSP, and `luau-lsp analyze` for the type gate
lefthook = "evilmartians/lefthook@2.1.17"   # git hooks
darklua = "seaofvoices/darklua@0.19.0"      # bundler for release builds and the Studio plugin
run-in-roblox = "rojo-rbx/run-in-roblox@0.3.0"
# The two publishers, run by hand at a release (see "Releasing" in CLAUDE.md). Pinned because a release
# is the one time they run, and an unpinned tool is then whichever version the machine happens to have.
pesde = "pesde-pkg/pesde@0.7.4+registry.0.2.3"  # publishes the CLI as the pesde package xopoiii/blinkblox
wally = "UpliftGames/wally@0.3.2"               # publishes the library from release/wally
