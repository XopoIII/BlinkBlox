name: Deploy docs to GitHub Pages

# Publishes on every push to main rather than on a release, for two reasons.
#
# Documentation describes what the compiler does NOW; tying it to releases meant a corrected option
# or a new page sat unpublished until the next version was cut.
#
# And a release-triggered run deploys from the TAG, which the `github-pages` environment refuses:
# "Tag v0.19.0 is not allowed to deploy to github-pages due to environment protection rules". The
# environment allows protected branches, so main is the source it expects. Loosening that protection
# to admit tags would be the wrong half of the problem to fix.
#
# The site is Astro Starlight in `docs/`; it replaced Nextra 2, whose pinned highlighter could not
# give code blocks a light theme. Pull requests build it in checks.yaml without deploying.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "gh-pages"
  cancel-in-progress: false

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Starlight's "last updated" date comes from git history.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: ./docs
        run: npm ci

      - name: Build
        working-directory: ./docs
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/dist

  deploy:
    name: "Deploy"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
