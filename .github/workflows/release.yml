# Builds the CLI binaries and the Studio plugin, and attaches them to a published release.
#
# ⚠️ THIS FORK DOES NOT PUBLISH TO PESDE, AND THAT IS DELIBERATE. Upstream's workflow ended with
# `pesde publish`, which pushes to the `1axen/blink` scope — a scope this fork cannot write to, and
# should not: publishing there would put fork builds in front of everyone who installs the upstream
# package. The step needed a PESDE_TOKEN secret that does not exist here either, so every release
# would have failed on its last step regardless.
#
# Install this fork from the release artifacts instead, for example through rokit:
#     rokit add XopoIII/blink@0.22.0
name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

env:
  GH_TOKEN: ${{github.token}}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup rokit
        uses: CompeyDev/setup-rokit@v0.1.0

      - name: Build binaries
        run: lune run build

      - name: linux-aarch64
        run: gh release upload ${{github.event.release.tag_name}} release/blink-linux-aarch64.tar.xz

      - name: linux-x86_64
        run: gh release upload ${{github.event.release.tag_name}} release/blink-linux-x86_64.tar.xz

      - name: macos-aarch64
        run: gh release upload ${{github.event.release.tag_name}} release/blink-macos-aarch64.tar.xz

      - name: macos-x86_64
        run: gh release upload ${{github.event.release.tag_name}} release/blink-macos-x86_64.tar.xz

      - name: windows-x86_64
        run: gh release upload ${{github.event.release.tag_name}} release/blink-windows-x86_64.tar.gz

      - name: plugin
        run: gh release upload ${{github.event.release.tag_name}} release/blink-plugin.rbxm
