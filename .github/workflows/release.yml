# Builds the CLI binaries and the Studio plugin, and attaches them to a published release.
#
# Publishing to pesde is not part of this workflow. Upstream's ended with `pesde publish` into the
# `1axen/blink` scope, which this fork must never write to: it would put fork builds in front of
# everyone who installs the upstream package. The fork is published under its own scope,
# `xopoiii/blinkblox` (see pesde.toml), by hand, after the release artifacts below exist.
#
# Rokit installs straight from these artifacts:
#     rokit add XopoIII/BlinkBlox blinkblox
name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

env:
  GH_TOKEN: ${{github.token}}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup rokit
        uses: CompeyDev/setup-rokit@v0.1.0

      - name: Build binaries
        run: lune run build

      - name: linux-aarch64
        run: gh release upload ${{github.event.release.tag_name}} release/blinkblox-linux-aarch64.tar.xz

      - name: linux-x86_64
        run: gh release upload ${{github.event.release.tag_name}} release/blinkblox-linux-x86_64.tar.xz

      - name: macos-aarch64
        run: gh release upload ${{github.event.release.tag_name}} release/blinkblox-macos-aarch64.tar.xz

      - name: macos-x86_64
        run: gh release upload ${{github.event.release.tag_name}} release/blinkblox-macos-x86_64.tar.xz

      - name: windows-x86_64
        run: gh release upload ${{github.event.release.tag_name}} release/blinkblox-windows-x86_64.tar.gz

      - name: plugin
        run: gh release upload ${{github.event.release.tag_name}} release/blinkblox-plugin.rbxm
